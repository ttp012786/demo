openapi: 3.0.3
info:
  title: Parcel Tracking API
  description: API for tracking parcels received at hotel reception
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /guests:
    get:
      summary: Get a list of checked-in guests
      operationId: getCheckedInGuests
      tags:
        - Guests
      responses:
        "200":
          description: List of guests currently checked into the hotel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"

  /guests/{guestId}/parcels:
    get:
      summary: Get parcels for a specific guest
      operationId: getGuestParcels
      tags:
        - Parcels
      parameters:
        - name: guestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of parcels for the guest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parcel"
        "404":
          description: Guest not found

    post:
      summary: Register a new parcel for a checked-in guest
      operationId: registerParcel
      tags:
        - Parcels
      parameters:
        - name: guestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParcelRequest"
      responses:
        "201":
          description: Parcel registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "400":
          description: Invalid request
        "404":
          description: Guest not found

  /parcels/{parcelId}/pickup:
    post:
      summary: Mark a parcel as picked up by a guest
      operationId: pickupParcel
      tags:
        - Parcels
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parcel marked as picked up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "404":
          description: Parcel not found

components:
  schemas:
    Guest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roomNumber:
          type: string

    Parcel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        guestId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING_PICKUP, PICKED_UP]

    ParcelRequest:
      type: object
      properties:
        receivedAt:
          type: string
          format: date-time

tags:
  - name: Guests
    description: Operations related to guests in the hotel
  - name: Parcels
    description: Operations related to parcel management
