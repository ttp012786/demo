spring:
  r2dbc:
    url: r2dbc:tc:postgresql:15:///testdb  # Testcontainers PostgreSQL R2DBC
    username: test
    password: test

  datasource:  # Separate JDBC datasource for Flyway
    url: jdbc:tc:postgresql:15:///testdb  # Testcontainers JDBC for Flyway
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/test


# Other configurations
server:
  port: 8080                                     # Set the server port
  servlet:
    context-path: /api                           # Set the context path of the application
